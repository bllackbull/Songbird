name: Docker

on:
  release:
    types: [published]
  # Allows manually running the build from the Actions tab. Run this from the
  # `main` branch (the ref must contain this trigger) and pass the release tag
  # you want to build via the `tag` input, e.g. `v0.11.2`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build. Leave empty to build the selected ref.'
        required: false
        type: string

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For a manual run with a tag input, check out that tag's source so
          # the image is built from the released code. Otherwise use the ref
          # that triggered the workflow (the release tag, or the selected ref).
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ghcr.io uses the built-in GITHUB_TOKEN (packages: write permission),
      # so no extra secret is required. Images appear under the repo's
      # "Packages" section on GitHub.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags from the release tag
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Tags are applied to both registries. metadata-action lowercases
          # the image path automatically (ghcr.io requires lowercase).
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/songbird
            ghcr.io/${{ github.repository }}
          # `value=${{ inputs.tag }}` overrides the version for manual runs.
          # When empty (automatic release event), type=semver falls back to the
          # git ref (the release tag), preserving the original behavior.
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
