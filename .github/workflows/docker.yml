name: Docker

on:
  release:
    types: [published]
  # Allows manually running the build from the Actions tab. Run this from the
  # `main` branch (the ref must contain this trigger) and pass the release tag
  # you want to build via the `tag` input, e.g. `v0.11.2`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build. Leave empty to build the selected ref.'
        required: false
        type: string

jobs:
  # Main image is built natively per-arch
  build-main-amd64:
    name: Build main image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For a manual run with a tag input, check out that tag's source so
          # the image is built from the released code. Otherwise use the ref
          # that triggered the workflow (the release tag, or the selected ref).
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ghcr.io uses the built-in GITHUB_TOKEN (packages: write permission),
      # so no extra secret is required. Images appear under the repo's
      # "Packages" section on GitHub.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/songbird
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.tag }}
            type=raw,value=latest

      - name: Set lowercase GHCR image name
        run: |
          echo "GHCR_IMAGE=ghcr.io/$(echo \"$GITHUB_REPOSITORY\" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push by digest (amd64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: |
            type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/songbird,push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=main-amd64
          cache-to: type=gha,mode=max,scope=main-amd64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-main-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-main-arm64:
    name: Build main image (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/songbird
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.tag }}
            type=raw,value=latest

      - name: Set lowercase GHCR image name
        run: |
          echo "GHCR_IMAGE=ghcr.io/$(echo \"$GITHUB_REPOSITORY\" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push by digest (arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: |
            type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/songbird,push-by-digest=true,name-canonical=true,push=true
            type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=main-arm64
          cache-to: type=gha,mode=max,scope=main-arm64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-main-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-main:
    name: Push main multi-arch manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-main-amd64, build-main-arm64]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-main-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Docker Hub)
        id: meta-dh
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/songbird
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.tag }}
            type=raw,value=latest

      - name: Extract metadata (GHCR)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.tag }}
            type=raw,value=latest

      - name: Create manifest list and push
        run: |
          # ghcr.io requires lowercase repo path; metadata tags are already
          # lowercased, but the @digest source refs must be lowercased manually.
          REPO_LC=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          DH_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/songbird"
          GHCR_IMAGE="ghcr.io/${REPO_LC}"
          shopt -s nullglob
          DIGESTS=(/tmp/digests/*)
          if [ ${#DIGESTS[@]} -eq 0 ]; then
            echo "No digests found in /tmp/digests" >&2
            exit 1
          fi
          DH_SOURCES=""
          GHCR_SOURCES=""
          for d in "${DIGESTS[@]}"; do
            DIGEST="sha256:$(basename "$d")"
            DH_SOURCES="$DH_SOURCES ${DH_IMAGE}@${DIGEST}"
            GHCR_SOURCES="$GHCR_SOURCES ${GHCR_IMAGE}@${DIGEST}"
          done
          echo "$DH_SOURCES" | xargs -r docker buildx imagetools create $(jq -cr '.tags | map("-t "+.) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON_META_DH")
          echo "$GHCR_SOURCES" | xargs -r docker buildx imagetools create $(jq -cr '.tags | map("-t "+.) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON_META_GHCR")
        env:
          DOCKER_METADATA_OUTPUT_JSON_META_DH: ${{ steps.meta-dh.outputs.json }}
          DOCKER_METADATA_OUTPUT_JSON_META_GHCR: ${{ steps.meta-ghcr.outputs.json }}

  build-and-push-worker:
    name: Build and push worker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/songbird-worker
            ghcr.io/${{ github.repository }}-worker
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: worker
          file: worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

