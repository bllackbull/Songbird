name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Server tests ─────────────────────────────────────────────────────────────
  test-server:
    name: Server tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Run server tests
        run: npm test --prefix server

  # ── Client unit tests ─────────────────────────────────────────────────────────
  test-client-unit:
    name: Client unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Run client unit tests
        run: npm run test:unit --prefix client

  # ── Client browser tests (Playwright) ────────────────────────────────────────
  test-client-browser:
    name: Client browser tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Install Playwright browsers
        run: npx --prefix client playwright install --with-deps chromium firefox

      - name: Run client browser tests
        run: npm run test:browser --prefix client

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build client
    runs-on: ubuntu-latest
    needs: [test-server, test-client-unit, test-client-browser]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Build client
        run: npm run build --prefix client
