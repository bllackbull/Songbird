name: Release

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Semantic-release determines the last version from Git tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Semantic Release
        run: npx semantic-release
        env:
          # Use a PAT (not the default GITHUB_TOKEN) so that the release/tag
          # created here is attributed to a real user identity.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}


